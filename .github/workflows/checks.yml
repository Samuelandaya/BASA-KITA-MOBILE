# Checks the mobile app on every push and pull request.
name: Mobile checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  kotlin:
    name: Kotlin app build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
