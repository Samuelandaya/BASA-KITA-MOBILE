# Checks the mobile app on every push and pull request.
name: Mobile checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
