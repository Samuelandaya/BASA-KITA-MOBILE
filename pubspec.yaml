name: basa_kita
description: "BASA-KITA: Read, Speak, Learn. Filipino and English reading for kindergarten learners."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  http: ^1.5.0
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  model_viewer_plus: ^1.10.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/covers/
    - assets/models/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Chewy
      fonts:
        - asset: assets/fonts/Chewy-Regular.ttf
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf

# App icon: the full BASA-KITA logo (1024 px). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFF9ED"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
